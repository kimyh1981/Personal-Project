# 실거주 매수 판단기를 GitHub Pages에 배포한다 (휴대폰 앱 설치용 HTTPS 주소)
name: Deploy analyzer to GitHub Pages

on:
  push:
    branches: [master]
    paths: ['real-estate-analyzer/**', 'news-briefing/**', '.github/workflows/pages.yml']
  workflow_dispatch:
  # 웹 버전의 규제 변경 스냅샷(data/regulation.json)을 6시간마다 새로 만든다
  schedule:
    - cron: '17 */6 * * *'
    # 아침 뉴스 브리핑(news/)은 한국 시간 새벽 5시에 새로 모은다. 6시간마다 도는 배포 때도 다시 모은다
    - cron: '0 20 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: real-estate-analyzer
        run: npm test
      - name: Test news briefing
        working-directory: news-briefing
        run: npm test
      - name: Collect site files
        run: |
          mkdir -p _site
          cd real-estate-analyzer
          cp -r index.html my.html guide.html manifest.webmanifest sw.js css js vendor icons media ../_site/
          mkdir -p ../_site/news
          cd ../news-briefing
          cp -r index.html manifest.webmanifest js icons ../_site/news/
      # 아침 뉴스 브리핑: 신문사·농업·비료·국제/경제 헤드라인을 모아 news/briefing.json·briefing.txt를 만든다
      - name: News briefing
        working-directory: news-briefing
        timeout-minutes: 3
        continue-on-error: true
        run: node tools/collect.js ../_site/news
      # 서울 시장 데이터(내 맞춤 추천용)는 주 1회만 새로 모은다: 이번 주 캐시가 있으면 재사용
      - name: Week key
        id: week
        run: echo "week=$(TZ=Asia/Seoul date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore Seoul market
        id: market
        uses: actions/cache@v4
        with:
          path: real-estate-analyzer/.market
          # v4: 아파트 + 빌라·단독주택 매매·전월세 수집. 수집이 실패하면 예전 캐시를 그대로 쓴다
          key: market-seoul-v4-${{ steps.week.outputs.week }}
          restore-keys: |
            market-seoul-v4-
            market-seoul-v3-
            market-seoul-v2-
            market-seoul-
      - name: Seoul market snapshot
        if: steps.market.outputs.cache-hit != 'true'
        working-directory: real-estate-analyzer
        timeout-minutes: 25
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node tools/market.js .market
      - name: Add market data to site
        run: |
          mkdir -p _site/data
          cp real-estate-analyzer/.market/*.json _site/data/ 2>/dev/null || echo "시장 데이터 없음"
      - name: Regulation snapshot
        working-directory: real-estate-analyzer
        timeout-minutes: 4
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node tools/snapshot.js ../_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
