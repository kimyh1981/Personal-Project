# 아침 뉴스 브리핑: PR마다 테스트하고, 실제 RSS를 모아 출처별로 몇 건 읽혔는지 로그에 남긴다
name: News briefing check

on:
  pull_request:
    paths: ['news-briefing/**', '.github/workflows/news-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: news-briefing
        run: npm test
      - name: Live collect
        working-directory: news-briefing
        timeout-minutes: 3
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          node tools/collect.js dist
          echo '--- 원고 ---'
          cat dist/briefing.txt
